<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MTG Card PDF</title>
  <!--
    GitHub Pages serves this repository from its root, but the app lives in src/.
    The path is relative, so this works under any user/project URL.
  -->
  <link rel="canonical" href="src/">
  <meta http-equiv="refresh" content="0; url=src/">
  <script>
    // replace() rather than assign(), so Back does not bounce straight back here.
    location.replace('src/' + location.search + location.hash);
  </script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #1a1a1a;
           color: #e8e8e8; margin: 0; padding: 2rem; }
    a { color: #6b9bd1; }
  </style>
</head>
<body>
  <p>Redirecting to <a href="src/">src/</a>…</p>
</body>
</html>
